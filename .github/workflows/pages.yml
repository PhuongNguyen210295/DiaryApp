name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, ccr-dbe9cb31-avoun7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css app.js db.js levels.js checkin.js journeymap.js sw.js manifest.webmanifest icons fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
